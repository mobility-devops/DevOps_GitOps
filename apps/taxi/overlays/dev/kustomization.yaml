apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: taxi-dev
resources:
  - ../../base
  - namespace.yaml
  - ../../../../secrets/taxi-dev          # SealedSecret(DB 계정). secrets/ 는 CODEOWNERS 승인 대상
patches:
  - path: patch-config.yaml
  - path: patch-httproute.yaml
    target:
      kind: HTTPRoute
      name: taxi
  - target:                               # dev 앱은 가장 낮은 등급 (자리가 모자라면 먼저 밀려남)
      kind: Deployment
      name: taxi
    patch: |-
      - op: add
        path: /spec/template/spec/priorityClassName
        value: taxi-dev-low
# Jenkins(CI)는 아래 digest 한 줄만 바꾸는 PR을 만든다.
images:
  - name: ghcr.io/mobility-devops/taxi-backend
    digest: sha256:4123c3f7dd708639eb24945553fbdb02a556118a9f3fc40f60c1a6d4369101e9
