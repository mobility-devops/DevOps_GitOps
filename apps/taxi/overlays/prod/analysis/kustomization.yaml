# Canary 자동 판정 재료. (CD 가이드 8단계)
# Rollout 단계 연결은 workload/rollout.yaml의 steps에 있다(파트 E).
#   setCanaryScale → smoke-test → 10% → canary-analysis → 30% → canary-analysis → 60% → canary-analysis → 100%
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - smoke-test.yaml
  - canary-analysis.yaml
configMapGenerator:
  - name: taxi-k6-scripts
    files:
      - k6/smoke.js
      - k6/load.js
generatorOptions:
  # AnalysisTemplate은 CRD라 kustomize가 ConfigMap 이름 변경(해시 접미사)을 따라 고치지 못한다. 이름을 고정한다.
  disableNameSuffixHash: true
