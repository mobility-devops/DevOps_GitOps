# prod 앱. Deployment 대신 Argo Rollouts의 Rollout으로 Canary 배포한다. (CD 가이드 7단계, 아키텍처 6장)
# Pod 스펙은 base/deployment.yaml과 같게 유지한다(A안: 구조가 명시적인 대신 약 40줄 중복).
# base의 컨테이너 설정(probe, resources 등)을 바꾸면 이 파일도 같이 바꿔야 한다.
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: taxi
spec:
  replicas: 2                                     # 머신마다 1개 (호스트 / 노트북)
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: taxi
  template:
    metadata:
      labels:
        app: taxi
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      # 머신 기준 + 노드 기준으로 고르게 나눈다. (아키텍처 3장)
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone       # 머신 기준 (host / laptop)
          whenUnsatisfiable: ScheduleAnyway               # 노트북이 꺼지면 호스트로 옮겨가야 하므로
          nodeTaintsPolicy: Honor                         # 죽은 노드는 계산에서 뺌
          labelSelector:
            matchLabels:
              app: taxi
          matchLabelKeys:
            - rollouts-pod-template-hash                  # 옛 버전·새 버전을 따로 세서 Canary Pod도 머신마다 1개씩
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname             # 노드 기준 (호스트로 몰릴 때 worker1·2에 고르게)
          whenUnsatisfiable: ScheduleAnyway
          nodeTaintsPolicy: Honor
          labelSelector:
            matchLabels:
              app: taxi
          matchLabelKeys:
            - rollouts-pod-template-hash
      containers:
        - name: taxi
          # 실제 이미지는 kustomization.yaml의 images(digest)로 바뀐다.
          image: ghcr.io/mobility-devops/taxi-backend:placeholder
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: taxi-config
            - secretRef:
                name: taxi-db
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5"]
          # CPU limit은 걸지 않는다(throttling으로 p95가 튐). memory limit은 건다.
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
  strategy:
    canary:
      stableService: taxi                         # 지금 서비스 중인 버전
      canaryService: taxi-canary                  # 새 버전
      trafficRouting:
        plugins:
          argoproj-labs/gatewayAPI:               # HTTPRoute weight를 바꿔서 트래픽을 나눔
            httpRoute: taxi
            namespace: taxi-prod
            # Canary 중 HTTPRoute에 in-progress 라벨을 붙이지 않는다.
            # Git에 없는 라벨이 생기면 Argo CD selfHeal과 부딪힐 수 있어서 끈다. (kind 리허설에서 라벨이 붙는 것 확인)
            disableInProgressLabel: true
      steps:
        - setCanaryScale:
            replicas: 2                           # 새 버전도 머신마다 1개 → 판정이 한쪽 머신 성능에 치우치지 않게
        - setWeight: 10
        - pause: {}                               # 지금은 사람이 promote. 자동 판정(AnalysisTemplate)은 8단계에서 붙인다
        - setWeight: 30
        - pause: {}
        - setWeight: 60
        - pause: {}
