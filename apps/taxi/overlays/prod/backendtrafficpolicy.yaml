# prod 앱으로 가는 Envoy 설정: 응답 없는 Pod를 Envoy가 직접 빼고, 연결 실패는 다른 Pod로 다시 보낸다. (10-14 Server 1)
# 노트북이 갑자기 끊기면 쿠버네티스가 노드를 NotReady로 판정하기까지(약 40초) 노트북 Pod도 대상에 남는다.
# active 헬스체크는 Envoy가 직접 하므로 그 40초와 Envoy Gateway 컨트롤러 상태에 상관없이 4~6초 안에 뺀다.
#
# 일부러 넣지 않은 것 (Canary 자동 판정과 충돌):
#   - passive 헬스체크(outlier detection): 500을 내는 Canary Pod를 트래픽에서 빼면 판정 쿼리의
#     "요청 200건 이상" 조건을 못 채워 자동 롤백 대신 배포가 멈춘다.
#   - 5xx·gateway-error 재시도, 요청 타임아웃: Canary error·slow 시나리오의 결과가 바뀐다.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: taxi
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: taxi
  timeout:
    tcp:
      connectTimeout: 1s              # 끊긴 노드로의 연결 시도를 1초 만에 포기 (기본 10초)
  retry:
    numRetries: 2
    retryOn:
      triggers:
        - connect-failure             # 연결 자체가 안 된 경우만. 요청이 앱에 닿지 않았으므로 두 번 처리될 일이 없다
  healthCheck:
    active:                           # 2초마다 readiness 확인, 2번 연속 실패하면 제외, 1번 성공하면 복귀
      type: HTTP
      http:
        path: /actuator/health/readiness   # FAULT_MODE 고장 대상(/api/**)이 아니라 Canary 시험 중에도 200
        expectedStatuses:
          - 200
      interval: 2s
      timeout: 1s
      unhealthyThreshold: 2
      healthyThreshold: 1
