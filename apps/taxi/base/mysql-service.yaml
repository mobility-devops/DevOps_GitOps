# 클러스터 밖 db-01(192.168.56.31)을 클러스터 안에서 mysql 이라는 이름으로 부른다. (아키텍처 7장)
apiVersion: v1
kind: Service
metadata:
  name: mysql
spec:
  ports:
    - name: mysql
      port: 3306
      targetPort: 3306
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: mysql-db-01
  labels:
    kubernetes.io/service-name: mysql
addressType: IPv4
ports:
  - name: mysql
    port: 3306
    protocol: TCP
endpoints:
  - addresses:
      - 192.168.56.31
    # 쿠버네티스가 빈 conditions: {} 를 채워 넣어 Argo CD가 OutOfSync로 본다. 값을 미리 적어 둔다.
    # ready를 비워 두면 '준비됨'으로 취급되므로 true와 동작은 같다.
    conditions:
      ready: true
