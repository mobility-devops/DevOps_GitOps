# Envoy Gateway 설정. argocd/apps/platform-envoy-gateway-config.yaml이 적용한다(wave 0).
# 컨트롤러는 argocd/apps/platform-envoy-gateway.yaml이 먼저 설치한다(wave -1).
#
# Gateway API CRD는 컨트롤러 차트(gateway-helm)에 들어 있다. 따로 kubectl apply로 또 설치하지 않는다(버전 충돌).
# 리소스마다 namespace가 달라서 여기서는 namespace를 일괄 지정하지 않는다.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - envoyproxy.yaml
  - gatewayclass.yaml
  - gateway.yaml
