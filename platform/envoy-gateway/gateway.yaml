apiVersion: v1
kind: Namespace
metadata:
  name: gateway
---
# 외부 입구 하나(.200)에 listener 3개. (아키텍처 4장)
# listener마다 호스트 이름과 받을 namespace를 묶어서, dev HTTPRoute에 prod 주소를 잘못 적어도
# prod 입구에 붙지 않게 한다.
#
# 연결이 안 될 때(404만 나고 에러 없음) 디버깅용으로 아래 한 listener를 임시로 쓸 수 있다.
#   - name: debug
#     protocol: HTTP
#     port: 80
#     allowedRoutes:
#       namespaces:
#         from: All
#
# HTTPS(443)는 cert-manager 단계에서 listener를 추가한다. 우선 HTTP로 끝까지 뚫는다.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: taxi-gateway
  namespace: gateway
spec:
  gatewayClassName: eg
  listeners:
    - name: prod-http
      protocol: HTTP
      port: 80
      hostname: taxi.192-168-56-200.sslip.io
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: taxi-prod
    - name: dev-http
      protocol: HTTP
      port: 80
      hostname: taxi-dev.192-168-56-200.sslip.io
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: taxi-dev
    - name: argocd-http
      protocol: HTTP
      port: 80
      hostname: argocd.192-168-56-200.sslip.io
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: argocd
