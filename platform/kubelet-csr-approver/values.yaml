# kubelet-csr-approver helm values. kubelet 서빙 인증서 요청(CSR)을 우리 노드 이름·IP일 때만 자동 승인한다. (아키텍처 3장)
# argocd/apps/platform-kubelet-csr-approver.yaml 이 이 파일로 설치한다(wave -1).
# 손으로 설치할 때(연습용):
#   helm repo add kubelet-csr-approver https://postfinance.github.io/kubelet-csr-approver && helm repo update
#   helm install kubelet-csr-approver kubelet-csr-approver/kubelet-csr-approver --version 1.2.15 -n kube-system -f platform/kubelet-csr-approver/values.yaml
# 차트 1.2.15 = 앱 v1.2.15.
# 왜 필요한가: kubeadm 설정이 serverTLSBootstrap: true 라 kubelet 이 서빙 인증서를 CSR 로 요청한다.
#   설치 때 Ansible(k8s_master·k8s_worker Role)이 처음 한 번만 승인했으므로, 인증서 갱신·새 노드 요청은 이 컨트롤러가 승인한다.
#   승인이 안 되면 metrics-server 가 kubelet 에 TLS 로 붙지 못한다.
providerRegex: ^k8s-(master|worker[1-3])$   # 노드 이름 (Vagrantfile·Ansible 인벤토리와 같음)
providerIpPrefixes:                          # CSR 에 적힌 IP 가 이 대역일 때만. kubelet --node-ip 가 192.168.56.21~24 라 이 IP 만 들어간다
  - 192.168.56.0/24
bypassDnsResolution: true                    # 노드 이름이 DNS 에 없다 (/etc/hosts 로만 찾음)
