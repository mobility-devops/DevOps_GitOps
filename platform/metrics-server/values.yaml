# metrics-server helm values. kubectl top, HPA 가 쓰는 CPU·메모리 사용량(metrics.k8s.io)을 제공한다. (아키텍처 3장)
# argocd/apps/platform-metrics-server.yaml 이 이 파일로 설치한다(wave -1).
# 손으로 설치할 때(연습용):
#   helm repo add metrics-server https://kubernetes-sigs.github.io/metrics-server/ && helm repo update
#   helm install metrics-server metrics-server/metrics-server --version 3.14.0 -n kube-system -f platform/metrics-server/values.yaml
# 차트 3.14.0 = metrics-server v0.9.0.
#
# kubelet 에 내부망 IP 로 접속한다. 인증서는 serverTLSBootstrap 으로 클러스터 CA 가 발급해 --kubelet-insecure-tls 는 쓰지 않는다.
# 차트 defaultArgs 에 이미 --kubelet-preferred-address-types=InternalIP,ExternalIP,Hostname 이 있어 따로 넣지 않는다.
# PriorityClass 는 차트 기본값 system-cluster-critical 을 그대로 쓴다 (kube-system 의 클러스터 기본 구성요소 등급).
args: []
