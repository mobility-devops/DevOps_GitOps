# CD 가 관리하는 egress 정책 전용 단계 (Calico Role 11장 합의)
# 순서: cd-egress(500) → kube-admin(1000) → default(1,000,000) → kube-baseline(10,000,000)  (Calico v3.33 기본 tier 순서)
# 이 tier 의 정책이 결정하지 않은 통신은 다음 tier 로 넘긴다(Pass). 나중에 넣을 namespace NetworkPolicy(default tier)도 그대로 적용된다.
apiVersion: projectcalico.org/v3
kind: Tier
metadata:
  name: cd-egress
  annotations:
    argocd.argoproj.io/sync-wave: "-1"   # 같은 Application 안에서 정책보다 먼저 만든다
spec:
  order: 500
  defaultAction: Pass                    # 기본값은 Deny. 정책 마지막 Pass 규칙과 함께 이중으로 "결정 안 한 통신은 넘김"
