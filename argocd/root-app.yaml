# 루트 Application (App of Apps). (CD 가이드 6단계)
# argocd/apps/ 폴더의 Application들을 등록하고, 각 Application이 실제 리소스를 만든다.
# 클러스터를 새로 만들 때는 이 파일 하나만 등록하면 나머지가 sync wave 순서대로 올라온다.
#
#   1) Ansible: Calico + Argo CD 본체 설치 (argocd/install/values.yaml)
#   2) Ansible: Sealed Secrets 열쇠 복원 (secrets/README.md)
#   3) kubectl apply -f argocd/root-app.yaml
#
# sync wave
#   -2 우선순위   PriorityClass (globalDefault platform 포함, 이후 뜨는 Pod 가 등급을 받게 가장 먼저)
#   -1 컨트롤러   MetalLB, Envoy Gateway(+Gateway API CRD), Sealed Secrets, Argo Rollouts
#    0 설정       MetalLB IP 풀, GatewayClass·EnvoyProxy·Gateway, Argo CD 화면 HTTPRoute, Calico egress 정책
#    1 수집       Alloy, kube-state-metrics (모니터링 담당)
#    2 앱         taxi-dev, taxi-prod
# 각 컨트롤러 차트가 자기 CRD를 함께 설치하므로 CRD 전용 wave는 두지 않았다. (-2는 PriorityClass 전용)
# Argo CD 자신은 등록하지 않는다(설정 실수 한 번에 복구가 꼬임). 가장 마지막에 따로 붙인다.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
  labels:
    notifications: "off"     # 루트는 자식 상태를 그대로 따라 해서 알림이 중복된다. 전체 알림 구독에서 뺀다
spec:
  project: default
  source:
    repoURL: https://github.com/mobility-devops/DevOps_GitOps
    targetRevision: main
    path: argocd/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true        # argocd/apps에서 파일을 지우면 그 Application도 지운다
      selfHeal: true
