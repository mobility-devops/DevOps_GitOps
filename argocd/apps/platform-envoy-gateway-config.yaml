# [wave 0 설정] GatewayClass, EnvoyProxy(머신마다 1개, .200 고정), Gateway 창구 3개.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-envoy-gateway-config
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://github.com/mobility-devops/DevOps_GitOps
    targetRevision: main
    path: platform/envoy-gateway
  destination:
    server: https://kubernetes.default.svc
    namespace: envoy-gateway-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
