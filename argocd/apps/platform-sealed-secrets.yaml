# [wave -1 컨트롤러] Sealed Secrets. 클러스터를 새로 만들 때는 이 앱보다 먼저 열쇠를 복원해야 한다(Ansible).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-sealed-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  sources:
    - repoURL: https://bitnami.github.io/sealed-secrets
      chart: sealed-secrets
      targetRevision: 2.20.0
      helm:
        releaseName: sealed-secrets
        valueFiles:
          - $values/platform/sealed-secrets/values.yaml            # 설정은 GitOps 저장소의 values 파일을 그대로 쓴다
    - repoURL: https://github.com/mobility-devops/DevOps_GitOps
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true          # 큰 CRD는 일반 apply의 annotation 크기 제한(256KB)에 걸린다
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
