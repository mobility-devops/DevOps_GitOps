# [wave -2 우선순위] PriorityClass 3개. 컨트롤러(wave -1)보다 먼저 만들어 이후 뜨는 Pod 가 등급을 받게 한다.
# 클러스터 범위 리소스라 namespace 가 없다.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-priorityclass
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  project: default
  source:
    repoURL: https://github.com/mobility-devops/DevOps_GitOps
    targetRevision: main
    path: platform/priorityclass
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
