# argocd namespace의 SealedSecret 모음. platform/argocd-route 가 이 폴더를 불러온다.
# argocd-notifications-secret.yaml: Argo CD 알림용 Slack 봇 토큰(키 slack-token). 실제 클러스터 열쇠로 kubeseal 해서 만든 암호문이다. (CD-guide [수정본] E3)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - argocd-notifications-secret.yaml
